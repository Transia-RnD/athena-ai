[tool.poetry]
name = "athenah-ai"
version = "5.0.0"
description = "Hybrid RAG system for code with AST parsing, knowledge graph, and vector embeddings"
authors = ["Denis Angell <dangell@transia.co>"]

[tool.poetry.dependencies]
python = "^3.10.6"
unstructured = {extras = ["local-inference"], version = "^0.6.2"}
openai = "^2.6.1"
tiktoken = "^0.11.0"
tabulate = "^0.9.0"
google-cloud-storage = "^3.4.0"
python-dotenv = "^1.2.1"
anthropic = "^0.75.0"
cachetools = "^5.3.0"

# Pin exact versions
langchain = "1.1.0"
langchain-core = "1.1.0"
langgraph = "1.0.4"
langgraph-prebuilt = "1.0.5"
langsmith = "0.4.38"
langchain-community = "0.4.1"
langchain-openai = "1.1.0"
langchain-anthropic = "1.2.0"
langchain-xai = "1.1.0"
chromadb = "^1.5.9"
claude-agent-sdk = "^0.1.58"

# Hybrid RAG: AST parsing + Knowledge Graph (multi-language)
tree-sitter = "^0.23.0"
tree-sitter-cpp = "^0.23.0"
tree-sitter-python = "^0.23.0"
tree-sitter-typescript = "^0.23.0"
tree-sitter-javascript = "^0.23.0"
networkx = "^3.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.1"
flake8 = "^7.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
