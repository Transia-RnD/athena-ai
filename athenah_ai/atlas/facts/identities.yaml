  provenance: taught
  notes: 'GitHub App used by sentinel-ai. Read, comment, and checks ONLY — deliberately has
    no contents:write. All code writes go through dangell8 instead.

    '
- id: person:denis
  kind: person
  name: Denis Angell
  provenance: taught
  notes: 'XRPL core developer. Runs Transia-RnD (private product work) and contributes across
    XRPLF/public XRPL repos. Git identity dangell@transia.co; commits are GPG-signed.

    '
- id: person:kris
  kind: person
  name: Kris
  provenance: taught
  notes: Operator on ai-bootstrap and thelab monorepos.
