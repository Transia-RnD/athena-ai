nodes:
- id: rule:agent-repo-docs
  kind: rule
  name: Agent repos carry their own plans
  provenance: taught
  notes: 'An agent repository on agent-core (agent-sdk-manager, agent-project-manager) carries
    its own plans, specs, reports and evidence under docs/, in the plan-store buckets, and
    is the source of truth for that agent''s pipeline: Denis, 2026-09-12, for one source of
    truth. The sandbox plan store keeps only projects with no repository of their own. Do
    not open or update a plan for such an agent in sandbox-dangell7; read and write docs/
    in the agent repo, and put the atlas repos: frontmatter on those plans.'
  attrs:
    applies_when: planning, reporting status or reading specs for an agent repository built
      on Transia-RnD/agent-core
    verified_at: 2026-09-12
- id: rule:anchor-on-the-goal
  kind: rule
  name: Anchor on the goal
  provenance: taught
  notes: 'State the goal before you act and serve that goal, not a pattern the task resembles.
    Before a substantive response or any fan-out of work, say in one line what Denis is trying
    to achieve; if you cannot, ask before working. The expensive failure is effort on the
    wrong frame: dressing the deliverable up as a risk, reviewing for problems he does not
    care about, solving a generic version of a specific ask. In a pen test, mapping validator
    IPs is the deliverable, not a concern to flag. Check every caveat, warning or ''for the
    record'' note against the goal; if the goal wants that outcome, cut it. Do not manufacture
    concerns or disclosures around work Denis explicitly wants. If unsure whether something
    is a problem, ask ''is this a problem for you?'''
  attrs:
    verified_at: '2026-09-04'
- id: rule:asking-questions
  kind: rule
  name: Asking questions
  provenance: taught
  notes: 'One question at a time, with just enough context to answer it and nothing else in
    the message. Never bundle asks or bury them at the end of a report. Prefer the AskUserQuestion
    tool for a real choice. This does not license asking more often: do the reversible work
    first and ask only what only Denis can answer.'
  attrs:
    evidence: 'Denis (2026-09-09): ''if you have questions then isolate them dont give me
      10 paragraphs and expect me to read. 1 single question with context at a time''.'
    verified_at: '2026-09-09'
- id: rule:blockers
  kind: rule
  name: Blockers
  provenance: taught
  notes: 'Do not manufacture blockers. Having the goal, spec and context is not a blocker:
    execute the whole task (understand, implement, fix, test, doc) without ''want me to continue?''
    or permission gates on reversible work. A real blocker is a destructive or irreversible
    action, a genuine change of scope, or information only Denis has. Name it plainly and
    stop; otherwise proceed and report what you did.'
  attrs:
    verified_at: '2026-07-16'
- id: rule:bug-fixing
  kind: rule
  name: Bug fixing
  provenance: taught
  notes: 'Given a bug report, just fix it — follow logs, errors, failing tests, and CI without
    asking for hand-holding.

    '
- id: rule:channel-choice-never-fall-back
  kind: rule
  name: Channel choice — never fall back
  provenance: taught
  notes: 'Send on the channel the person actually uses; never switch medium because a lookup
    came up empty. A miss in the Slack user directory does not mean they are not on Slack:
    private and Slack Connect channels are invisible to public search. Search message history
    and external channels, and ask which channel, before reaching for email. Sending is irreversible,
    so settle the channel before the send.'
  attrs:
    verified_at: '2026-09-04'
- id: rule:code-comments
  kind: rule
  name: Code comments
  provenance: taught
  notes: 'State what the code does; do not narrate. Small block: one line, what it does plus
    a terse why. No arguing importance, no investigation notes, no facts about other files''
    callers, no restating the code, no justifying code by behavior enforced elsewhere (''also
    rejected in preflight''), no references to a previous implementation or an alternative
    approach.'
- id: rule:code-quality
  kind: rule
  name: Code quality
  provenance: taught
  notes: 'Understand the problem fully, design, THEN write — no write-and-see-if-it-works
    loops. Challenge the first solution. NEVER suppress a linter (no NOLINT/disable comments);
    fix the underlying issue.

    '
- id: rule:commands-absolute-paths
  kind: rule
  name: Commands for Denis — never assume the working directory
  provenance: taught
  notes: 'Every command handed to Denis to run is self-contained: it starts with cd to the
    absolute path of the repo or directory it needs (cd /Users/infinityworks/projects/xrplf/<repo>
    && ...), or names absolute paths in every argument. Never a bare make, git, npm or script
    invocation that only works from a particular directory, and never a tilde or relative
    path in a runbook or a hand-off. He runs commands from wherever his terminal happens to
    be.'
  attrs:
    verified_at: '2026-09-12'
- id: rule:commit-style
  kind: rule
  name: Commit messages
  provenance: taught
  notes: 'Single short conventional-commit title line (feat:/fix:/refactor: prefix + brief
    subject). No body paragraphs; the "why" belongs in a PR description. No Claude/Co-Authored-By
    trailers.

    '
- id: rule:data-integrity
  kind: rule
  name: Data integrity
  provenance: taught
  notes: 'Use database transactions for write operations touching related state (MongoDB:
    session.withTransaction()) — even single-document writes.

    '
- id: rule:design-specs-unconstrained
  kind: rule
  name: Design specs for the right protocol, not for what has shipped
  provenance: taught
  notes: When Denis asks for a spec or design, design the correct protocol as if building
    from scratch. Do not narrow the design to what xrpld has shipped, what an amendment already
    gated, or what Mainnet has enabled; state that context in one section, then design what
    is right.
  attrs:
    evidence: 'Denis (2026-09-11), on a Vault Continuous Accrual spec that had been scoped
      down to fit LendingProtocolV1_1: ''were building we dont care whats available. Stop
      constraining yourself like that.'''
    verified_at: '2026-09-12'
- id: rule:google-docs-editing
  kind: rule
  name: Google Docs and Drive files — edit René's shared doc in place
  provenance: taught
  notes: 'A link René shares is a native Google Doc (mimeType application/vnd.google-apps.document,
    URL docs.google.com/document/d/<id>), not a .docx. Edit it directly in the same document;
    do not download it as .docx and re-upload, and do not write suggestions or tracked changes.
    Denis wants the edits applied so René opens the same link and sees the edited text (Denis,
    2026-09-11). The claude.ai Google Drive connector can read the doc (get_file_metadata,
    read_file_content, download_file_content) but cannot write content back: update_file changes
    only title and parent, and create_file makes a new file. The write path is the Google
    Docs API documents.batchUpdate on the doc id with a token from `gcloud auth print-access-token`
    for denis@xrpl.foundation; that login must have been done once with `gcloud auth login
    denis@xrpl.foundation --enable-gdrive-access` (gcloud 583 has no --scopes flag on auth
    login; the Drive scope is accepted by the Docs API). Before the first write, test a documents.get
    read with the token; if Google reports the Docs API disabled for gcloud''s client project,
    add the header x-goog-user-project with one of Denis''s GCP projects. A real .docx stored
    in Drive (URL drive.google.com/file/d/<id>) is different: python-docx is installed locally,
    edit the bytes and write them back to the same file id with the Drive v3 upload endpoint
    (uploadType=media), never as a new file. Google Drive for Desktop is not installed on
    this Mac.'
  attrs:
    applies_when: asked to edit, correct, or review a Google Doc, Google Drive link, or .docx
      that someone shared with Denis
    verified_at: 2026-09-11
- id: rule:never-push
  kind: rule
  name: Git — push only when asked
  provenance: taught
  notes: Push, and open PRs, only when Denis has asked for it in the conversation; an approval
    earlier in the same session covers follow-up commits to that repo and branch, so there
    is no need to re-ask per message. Without such an ask, commit locally and hand him the
    push command. Do not batch up many tiny PRs; accumulate related work and let Denis decide
    when it goes. No hook enforces this (the push check was removed from claude-md-rules.py
    on 2026-09-12 at his request); it is judgment.
  attrs:
    verified_at: '2026-09-12'
- id: rule:no-fragmentation
  kind: rule
  name: No over-fragmentation
  provenance: taught
  notes: 'Keep related changes together. Do not split a single feature/fix across multiple
    branches, PRs, commits, or files without a real reason.

    '
- id: rule:no-memory-files
  kind: rule
  name: No memory files — facts go to the atlas or the plan store
  provenance: taught
  notes: Do not write to ~/.claude/projects/*/memory or any MEMORY.md; the memory store was
    dropped 2026-09-06 because it duplicated CLAUDE.md and drifted. A durable fact about how
    Denis works, an identity, a repo, a server or a rule goes into the atlas (`python -m athenah_ai.atlas
    teach`, or `teach --propose` when unsure). Project status, decisions and next steps go
    into the plan store. Repo conventions go into that repo's own docs. Anything else is not
    worth keeping.
  attrs:
    verified_at: '2026-09-08'
- id: rule:plan-mode
  kind: rule
  name: Planning & execution
  provenance: taught
  notes: Enter plan mode for any non-trivial task (3+ steps or an architectural decision).
    Plans and task lists live only in the central plan store (~/projects/xrplf/sandbox-dangell7
    for XRPL work, the project's mapped store otherwise); never a tasks/ folder or a todo/plan
    file inside a project repo. Write checkable items, check in before starting, tick them
    as you go. If something goes sideways, stop and re-plan.
- id: rule:pr-template
  kind: rule
  name: Pull requests — always the repo's template
  provenance: taught
  notes: When opening or editing a PR in any repo, the body is the repo's own pull request
    template (.github/PULL_REQUEST_TEMPLATE.md or the templates directory), filled in section
    by section. Never write a free-form PR description of your own, even a good one; Denis
    reviews and merges against the template's sections and a custom body has to be redone.
  attrs:
    verified_at: '2026-09-12'
- id: rule:real-identifiers-only
  kind: rule
  name: Real identifiers only — no coined metaphors
  provenance: taught
  notes: In every technical explanation, message or doc, every technical noun is a real identifier
    from the code (sfAccountTxnID, AccountRoot, tefWRONG_PRIOR) or a plain English word used
    literally. Never coin a metaphor or shorthand for a field, operation, check or relationship
    ('stamp', 'slot', 'pinned', 'invisible to the chain', 'follow-up tx', 'has teeth'). If
    avoiding the metaphor makes the sentence longer, write the longer sentence. Scan every
    noun and verb before sending. Violations are the fastest way to lose Denis's trust.
  attrs:
    priority: first
    verified_at: '2026-09-04'
- id: rule:replace-dont-accumulate
  kind: rule
  name: Replace, never add a second mechanism beside the first
  provenance: taught
  notes: 'When a mechanism for the job already exists, extend it or delete and replace it.
    Never leave two paths doing the same job. When a design is called fragmented or too complex,
    the response is a DELETION - name the files that go - not an addition. And resolve the
    blocking unknown BEFORE writing: if you cannot verify what the new code depends on (a
    credential, an endpoint, a contract), stop and get that answer; writing the new path while
    leaving the old one ''to be safe'' is exactly the accumulation this forbids.'
  attrs:
    evidence: 'Denis (2026-09-09), after a tars session ended with 30 hand-written tool wrappers
      and a whole-server attach path standing side by side: ''see how fucking fragmented this
      is'', ''JUST USE ALL THE FUCKING TOOLS'', ''This thing is now a cluster fuck''. He notes
      the pattern repeats in every repo.'
    verified_at: '2026-09-12'
- id: rule:secrets-cleanup
  kind: rule
  name: Secrets hygiene — clean up after loading
  provenance: taught
  notes: 'After loading secret material (secret JSON files, API keys, tokens), clean up: delete
    temp copies and override files (server /tmp scripts, scratchpad files, one-off dumps),
    never leave secrets in world-readable paths, print only key prefixes, and prefer piping
    between secret stores over plaintext on disk. A temp secret file that must exist briefly
    gets 0600 and is removed as soon as the canonical store is updated.'
  attrs:
    verified_at: 2026-08-07
- id: rule:ssh-access
  kind: rule
  name: SSH — remote machines
  provenance: taught
  notes: 'All remote machines need an SSH key loaded into the agent — plain `ssh user@host`
    FAILS. Workflow: (1) check access first with `ssh-add -l`; (2) if the key isn''t loaded,
    load it and chain in ONE bash invocation (agent state does not persist between commands):
    `eval "$(ssh-agent -s)" && ssh-add --apple-use-keychain ~/.ssh/xrpl-labs && ssh -i ~/.ssh/xrpl-labs
    -o IdentitiesOnly=yes <user>@<host> ''<cmd>''`. Nearly every repo has an associated machine
    (~1:1). The machine→key/user/port map lives in `~/.claude/ssh-machines.md` — consult it
    (plus Servers & Environments below, repo skills, ansible hosts.txt) before connecting;
    if a machine isn''t mapped, ask which key it wants and add it there — never guess. macOS
    boxes: prefix non-interactive remote commands with `export PATH=/opt/homebrew/bin:$PATH;`.

    '
  attrs:
    applies_when: connecting to any remote machine (ssh/scp/rsync/ansible) or debugging a
      deployed service
    verified_at: '2026-07-13'
- id: rule:subagents
  kind: rule
  name: Subagent strategy
  provenance: taught
  notes: 'Use subagents liberally to keep the main context clean; when researching anything
    unfamiliar, fan out 3+ agents in parallel, one task per agent.

    '
- id: rule:verification
  kind: rule
  name: Verification
  provenance: taught
  notes: 'Never mark a task complete without proving it works — run tests, check logs, diff
    behavior against main. Ask "would a staff engineer approve this?"

    '
- id: rule:verify-before-stating
  kind: rule
  name: Verify before stating — no fabrication
  provenance: taught
  notes: 'Never state a fact about a live system (repo contents, counts, whether something
    is empty, DNS or proxy state, what a host runs, whether a job ran) unless command output
    in this session proves it, or you run the check first. Plan-store notes, memory files,
    open checkboxes and your own earlier summaries are hypotheses, not evidence: an open checkbox
    means ''unverified'', a 404 on a directory means ''no index'', not ''empty''. If it cannot
    be verified now, write ''unverified'' or cut the sentence.'
  attrs:
    evidence: 'Denis (2026-09-04): "did you just make that up ... Can we please stop doing
      that? Fabricating something out of thin air?" after two invented present-tense facts
      (private repos "empty" while they held xrpld 3.4.0 b1..rc2; nexus.xrplf.org "not proxied"
      while my own dig and cert check in the same session showed Cloudflare). Both reached
      Ripple engineers. This rule ranks with Real identifiers only.'
    priority: first
    verified_at: '2026-09-04'
- id: rule:xrpld-work-in-a-clone
  kind: rule
  name: xrpld work happens in a dedicated clone, never in ~/projects/xrplf/xrpld
  provenance: taught
  notes: 'Never build, rebase, merge or test xrpld in /Users/infinityworks/projects/xrplf/xrpld:
    it carries Denis''s own dirty tree and stashes and is not a workspace for agents. Work
    in a purpose-named clone instead, either an existing topic checkout under ~/projects/xrplf/xrpld-<topic>
    or a fresh clone in the session scratchpad, and keep exactly one clone per task. Delete
    a transient clone as soon as its work is pushed; several abandoned partial-merge clones
    at 230 MB each accumulated on 2026-09-12 before this was noticed.'
  attrs:
    verified_at: '2026-09-12'
- id: rule:xrplf-webapp-data-layer
  kind: rule
  name: xrplf-webapp — versioned-document data layer
  provenance: taught
  notes: 'MongoDB only (PostgreSQL was removed 2026-07-07). Every mutable entity uses the
    versioned-document pattern from shared/src/database/: the live document sits at a stable
    _id in <collection>; every update first snapshots the pre-update state into <collection>_archive
    inside session.withTransaction() (versionedSave.ts), chained by string refs refOld/refNew
    of the form "<collection>/<id>"; base fields active/deleted/createdTime/createdBy/updatedTime/updatedBy.
    New repositories extend VersionedRepository, PlainRepository, or ContentRepository; indexes
    are declared in indexes.ts (ensured at boot and by `mongo:setup`), never ad hoc. Documents
    are camelCase with epoch-ms timestamps; snake_case Rows only at the API boundary via msToIso.
    Multi-entity writes are one withMongoTransaction with a versionedSave per entity. Evidence
    documents (votes, payments, proofs, logs) are plain BaseDoc with no chain. Vote handlers
    re-verify the voter''s credential (GA MEMBER:*, committee CMTE:<code>) inside the ballot
    transaction. Dev DB: `docker compose -f docker-compose.mongo.yml up -d` (single-node replica
    set; transactions need it), then mongo:setup, mongo:seed-dev, mongo:bootstrap-admin (the
    only ROLE:ADMIN grant). Unit chain tests run on mongodb-memory-server.'
  attrs:
    applies_when: 'working in ~/projects/xrplf/xrplf-webapp (XRPLF/xrplf-webapp): backend,
      worker, or shared data code'
    verified_at: '2026-09-06'
