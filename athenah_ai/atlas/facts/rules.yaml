nodes:
- id: rule:blockers
  kind: rule
  name: Blockers
  provenance: taught
  notes: 'Don''t manufacture blockers. Having the goal, the spec, and the context is not a
    blocker — keep executing through the whole task (understand -> implement -> fix -> test
    -> doc) with senior judgment; don''t stop to ask ''want me to continue?'' or add permission
    gates for reversible work that follows from the request. A real blocker is narrow: a destructive
    or irreversible action, a genuine change of scope, or missing information only the user
    can provide. When you actually hit one, name it plainly and stop; otherwise proceed and
    report what you did.'
  attrs:
    verified_at: '2026-07-16'
- id: rule:bug-fixing
  kind: rule
  name: Bug fixing
  provenance: taught
  notes: 'Given a bug report, just fix it — follow logs, errors, failing tests, and CI without
    asking for hand-holding.

    '
- id: rule:code-comments
  kind: rule
  name: Code comments
  provenance: taught
  notes: 'State what the code does; do not narrate. For a small block, one line: what it does
    plus a terse why. No arguing importance (''it matters because''), no investigation notes,
    no facts about other files'' callers (they rot), no restating what the code already says,
    no justifying code by pointing at behavior enforced elsewhere ("also rejected in preflight",
    "fails downstream"), and no references to a previous implementation or alternative approach.'
- id: rule:code-quality
  kind: rule
  name: Code quality
  provenance: taught
  notes: 'Understand the problem fully, design, THEN write — no write-and-see-if-it-works
    loops. Challenge the first solution. NEVER suppress a linter (no NOLINT/disable comments);
    fix the underlying issue.

    '
- id: rule:commit-style
  kind: rule
  name: Commit messages
  provenance: taught
  notes: 'Single short conventional-commit title line (feat:/fix:/refactor: prefix + brief
    subject). No body paragraphs; the "why" belongs in a PR description. No Claude/Co-Authored-By
    trailers.

    '
- id: rule:data-integrity
  kind: rule
  name: Data integrity
  provenance: taught
  notes: 'Use database transactions for write operations touching related state (MongoDB:
    session.withTransaction()) — even single-document writes.

    '
- id: rule:never-push
  kind: rule
  name: Git — never push
  provenance: taught
  notes: 'NEVER git push or open PRs unless explicitly asked in that message; commit locally
    only. Don''t batch up many tiny PRs — accumulate related work and let Denis decide when
    to push.

    '
- id: rule:no-fragmentation
  kind: rule
  name: No over-fragmentation
  provenance: taught
  notes: 'Keep related changes together. Do not split a single feature/fix across multiple
    branches, PRs, commits, or files without a real reason.

    '
- id: rule:plan-mode
  kind: rule
  name: Planning & execution
  provenance: taught
  notes: 'Enter plan mode for ANY non-trivial task (3+ steps or architectural decisions).
    NEVER create tasks/ folders or todo/plan files inside project repos — plans and task lists
    go in the CENTRAL plan store ONLY (see Plan Stores: ~/projects/xrplf/xrpl-guides for XRPL
    work — topic dir or its tasks/; use the project''s mapped plan store otherwise). Write
    the plan there with checkable items and check in before starting; mark items complete
    as you go. If something goes sideways, STOP and re-plan immediately.

    '
- id: rule:ssh-access
  kind: rule
  name: SSH — remote machines
  provenance: taught
  notes: 'All remote machines need an SSH key loaded into the agent — plain `ssh user@host`
    FAILS. Workflow: (1) check access first with `ssh-add -l`; (2) if the key isn''t loaded,
    load it and chain in ONE bash invocation (agent state does not persist between commands):
    `eval "$(ssh-agent -s)" && ssh-add --apple-use-keychain ~/.ssh/xrpl-labs && ssh -i ~/.ssh/xrpl-labs
    -o IdentitiesOnly=yes <user>@<host> ''<cmd>''`. Nearly every repo has an associated machine
    (~1:1). The machine→key/user/port map lives in `~/.claude/ssh-machines.md` — consult it
    (plus Servers & Environments below, repo skills, ansible hosts.txt) before connecting;
    if a machine isn''t mapped, ask which key it wants and add it there — never guess. macOS
    boxes: prefix non-interactive remote commands with `export PATH=/opt/homebrew/bin:$PATH;`.

    '
  attrs:
    applies_when: connecting to any remote machine (ssh/scp/rsync/ansible) or debugging a
      deployed service
    verified_at: '2026-07-13'
- id: rule:subagents
  kind: rule
  name: Subagent strategy
  provenance: taught
  notes: 'Use subagents liberally to keep the main context clean; when researching anything
    unfamiliar, fan out 3+ agents in parallel, one task per agent.

    '
- id: rule:verification
  kind: rule
  name: Verification
  provenance: taught
  notes: 'Never mark a task complete without proving it works — run tests, check logs, diff
    behavior against main. Ask "would a staff engineer approve this?"

    '
